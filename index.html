<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Caveira Bot · CCOS</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css?v=7.0.0">
</head>
<body>
  <canvas id="fundo-animado" aria-hidden="true"></canvas>

  <!-- CAPA DE ABERTURA -->
  <div id="capa" class="capa" aria-hidden="true">
    <img src="/logo.svg" alt="" class="capa-logo">
    <p class="capa-sub">CCOS · Porto do Açu</p>
    <div class="capa-barra"><span></span></div>
  </div>

  <!-- LOGIN -->
  <section id="tela-login" class="login" hidden>
    <form id="form-login" class="login-caixa">
      <img src="/logo.svg" alt="Caveira Bot" class="login-logo">
      <h1 class="sr-only">Caveira Bot</h1>
      <p class="mudo">CCOS · Porto do Açu</p>
      <input type="email" id="login-email" placeholder="Seu e-mail" autocomplete="username" required>
      <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password" required>
      <button class="btn primario largo" type="submit">Entrar</button>
      <p id="login-erro" class="erro" hidden></p>
      <p class="mudo pequeno" style="margin:0">Esqueceu a senha? Peça ao administrador uma senha provisória.</p>
    </form>
  </section>

  <!-- APLICATIVO -->
  <div id="app" hidden>
    <header class="topo">
      <div class="marca">
        <img src="/icon.svg" alt="" class="topo-logo">
        <div>
          <strong>Caveira Bot</strong>
          <span id="topo-sub" class="topo-sub"></span>
        </div>
      </div>
      <div class="topo-acoes">
        <button id="pilula-whats" class="pilula" title="WhatsApp do líder de plantão"><span class="ponto"></span><span class="txt">…</span></button>
        <button id="btn-menu" class="btn-icone" aria-label="Menu" title="Menu">☰</button>
      </div>
    </header>

    <main id="conteudo">
      <div id="subabas" class="subabas" hidden></div>
      <section id="aba-central" class="aba"></section>
      <section id="aba-relatorio" class="aba" hidden></section>
      <section id="aba-emails" class="aba" hidden></section>
      <section id="aba-pendencias" class="aba" hidden></section>
      <section id="aba-entrada" class="aba" hidden></section>
      <section id="aba-historico" class="aba" hidden></section>
      <section id="aba-roi" class="aba" hidden></section>
      <section id="aba-painel" class="aba" hidden></section>
    </main>

    <nav class="abas">
      <button data-grupo="plantao" class="ativa"><span class="ic">🧭</span>Plantão<span id="badge-central" class="badge" hidden></span></button>
      <button data-grupo="pendencias"><span class="ic">📌</span>Pendências<span id="badge-pendencias" class="badge" hidden></span></button>
      <button data-grupo="painel"><span class="ic">📊</span>Indicadores</button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-caixa" role="dialog" aria-modal="true">
      <div class="modal-topo">
        <h2 id="modal-titulo"></h2>
        <button class="btn-icone" data-fechar aria-label="Fechar">✕</button>
      </div>
      <div id="modal-corpo" class="modal-corpo"></div>
      <div id="modal-rodape" class="modal-rodape"></div>
    </div>
  </div>

  <div id="painel" class="painel" hidden></div>
  <div id="aviso" class="aviso" hidden></div>
  <div id="impressao"></div>

  <script src="/app.js?v=7.0.0"></script>
</body>
</html>
