# Roda os testes a cada envio para o GitHub.
# Inclui a trava do padrão do relatório (teste_padrao.js + testes/gabarito-relatorio.txt):
# se um tópico, número ou título mudar, este check fica vermelho e o Render não publica
# (com "Auto-Deploy: After CI Checks Pass" ligado no Render).
name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
